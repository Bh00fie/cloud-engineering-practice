# Netlify configuration — static site, no build step.
[build]
  publish = "."

# Serverless proxy for the in-app Gemini chatbot (needs GEMINI_API_KEY env var).
[functions]
  directory = "netlify/functions"

# Basic security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
